<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hùng gửi Ly 💍</title>

<style>
body {
    margin: 0;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #ffd6e8, #fff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.box {
    width: 92%;
    max-width: 420px;
    background: #fff;
    border-radius: 28px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    position: relative;
}

img {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 14px;
}

h1 {
    color: #ff4d88;
    font-size: 24px;
}

p {
    font-size: 16px;
    color: #555;
    line-height: 1.6;
}

.letters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
}

.letter {
    background: #ffe3ef;
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    font-size: 14px;
}

#letterContent {
    display: none;
    margin-top: 14px;
    color: #ff4d88;
    font-size: 15px;
}

.buttons {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 12px;
}

button {
    padding: 14px 22px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
    cursor: pointer;
}

#yes {
    background: #ff4d88;
    color: white;
}

#no {
    background: #eee;
    color: #555;
}

#tease {
    display: none;
    margin-top: 12px;
    font-size: 15px;
    color: #ff6fa1;
}

#final {
    display: none;
    margin-top: 18px;
    font-size: 18px;
    color: #ff4d88;
}

/* Hộp nhẫn */
#ringBox {
    display: none;
    margin-top: 20px;
    animation: pop 0.8s ease;
}

.ring {
    font-size: 60px;
    animation: shine 1.5s infinite;
}

.ring-text {
    font-size: 18px;
    color: #ff4d88;
    margin-top: 10px;
}

/* Tim bay */
.heart {
    position: absolute;
    font-size: 18px;
    animation: float 5s linear infinite;
    opacity: 0.7;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}

@keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
}

@keyframes shine {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}
</style>
</head>

<body onclick="playMusic()">

<div class="box">
    <img src="ly.jpg" alt="Ly 💖">

    <h1>Ly à 💍</h1>
    <p>
        Anh là Hùng.<br>
        Trước khi trả lời câu hỏi quan trọng này,<br>
        em mở vài bức thư anh viết cho em nhé 💌
    </p>

    <div class="letters">
        <div class="letter" onclick="openLetter(1)">📩 Thư 1</div>
        <div class="letter" onclick="openLetter(2)">📩 Thư 2</div>
        <div class="letter" onclick="openLetter(3)">📩 Thư 3</div>
    </div>

    <div id="letterContent"></div>

    <p><strong>Ly có đồng ý làm vợ anh không?</strong></p>

    <div class="buttons">
        <button id="yes">Đồng ý 💍</button>
        <button id="no">Không 🙈</button>
    </div>

    <div id="tease"></div>

    <div id="final">
        Từ hôm nay và cả sau này nữa,<br>
        cho anh được nắm tay em đi qua mọi điều trong cuộc sống nhé 💖
    </div>

    <div id="ringBox">
        <div class="ring">💍</div>
        <p class="ring-text">Ly, làm vợ anh nhé 💖</p>
    </div>
</div>

<audio id="music" src="music.mp3" loop></audio>

<script>
/* Thư */
const letters = {
    1: "Anh không hứa cho em cả thế giới, nhưng hứa sẽ luôn đứng về phía em.",
    2: "Anh muốn mỗi sáng thức dậy, người đầu tiên anh nhìn thấy là em.",
    3: "Với anh, nhà là nơi có em ở đó."
};

function openLetter(n) {
    const c = document.getElementById("letterContent");
    c.style.display = "block";
    c.innerText = letters[n];
}

/* Trêu khi từ chối */
let teaseCount = 0;
const teaseTexts = [
    "Ơ kìa~ bấm nhầm đúng không đó 😆",
    "Nút này không hợp với em đâu Ly ơi 😜",
    "Tim em đang nói 'đồng ý' mà 😳",
    "Anh thấy em cười rồi đó nha 💖",
    "Thôi mà~ làm vợ anh đi 😘"
];

document.getElementById("no").onclick = () => {
    const t = document.getElementById("tease");
    t.style.display = "block";
    t.innerText = teaseTexts[Math.min(teaseCount, teaseTexts.length - 1)];
    teaseCount++;
};

/* Đồng ý */
document.getElementById("yes").onclick = () => {
    document.getElementById("final").style.display = "block";
    document.getElementById("ringBox").style.display = "block";
};

/* Nhạc */
const music = document.getElementById("music");
let played = false;
function playMusic() {
    if (!played) {
        music.play();
        played = true;
    }
}

/* Tim bay */
function createHeart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
}
setInterval(createHeart, 450);
</script>

</body>
</html>
